name: Build

on:
  push:
  pull_request:

# Submitting the dependency graph needs write access to the repository contents.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: corretto
          java-version: 25
      # Reports every resolved dependency, transitive ones included, to GitHub. Dependabot alerts use it to warn about
      # known vulnerabilities. Only pushes to master submit, that is the branch the alerts look at.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          dependency-graph: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'generate-and-submit' || 'disabled' }}
      # ACME test server for PebbleAcmeTest, Go is part of the runner image. Pinned to a version, like the actions.
      # Pebble validates HTTP-01 against the domain, so it must resolve to 127.0.0.1.
      - name: Install Pebble
        run: |
          go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.3
          echo "KOVEXY_PEBBLE=$(go env GOPATH)/bin/pebble" >> "$GITHUB_ENV"
          echo "127.0.0.1 kovexy.localhost" | sudo tee -a /etc/hosts
      - run: ./gradlew build shadowJar
      - name: Check merged SLF4J service file
        run: test "$(unzip -p build/libs/kovexy.jar META-INF/services/org.slf4j.spi.SLF4JServiceProvider)" = "bayern.kickner.klogger.slf4j.KloggerServiceProvider"
      - name: Upload fat JAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kovexy-jar
          path: build/libs/kovexy.jar
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: build/reports/tests/
