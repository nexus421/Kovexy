name: Release

# Runs when a release is published on GitHub. The tag must match the version in build.gradle.kts (tag v0.1.0 needs
# version = "0.1.0"), otherwise the run fails and attaches nothing. Then it runs all tests, builds kovexy.jar, checks
# it and attaches it together with its SHA-256 sum.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check that the tag matches the version
        # The v is required: the update check in Kovexy only sees tags like v1.2.0, a release tagged 1.2.0 would reach
        # nobody.
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match v$version from build.gradle.kts"
            exit 1
          fi

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: corretto
          java-version: 25

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - run: ./gradlew build shadowJar

      - name: Check merged SLF4J service file
        run: test "$(unzip -p build/libs/kovexy.jar META-INF/services/org.slf4j.spi.SLF4JServiceProvider)" = "bayern.kickner.klogger.slf4j.KloggerServiceProvider"

      - name: Attach kovexy.jar and its checksum to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/libs
          sha256sum kovexy.jar > kovexy.jar.sha256
          gh release upload "$GITHUB_REF_NAME" kovexy.jar kovexy.jar.sha256 --clobber --repo "$GITHUB_REPOSITORY"
